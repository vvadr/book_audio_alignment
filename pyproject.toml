[project]
name = "book-audio-alignment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vvadr", email = "abdulazizyusupaliev009@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "librosa>=1.0.0",
    "pymupdf>=2.0",
    "rapidfuzz>=3.14.6",
    "torch>=2.15.0",
    "transformers>=5.22.0",
]

[project.scripts]
book-audio-alignment = "book_audio_alignment:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# No src/book_audio_alignment package exists yet. Remove this line once it does.
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pip>=26.2.2",
]
